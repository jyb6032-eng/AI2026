<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말하는 대로 글씨가 나와요!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0fdf4; /* Very light green, calming for kids */
            /* Add a subtle dot pattern background */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .paper-bg {
            background-color: white;
            background-image: 
                linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
                linear-gradient(#eee .1em, transparent .1em);
            background-size: 100% 1.2em;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .text-display-area {
            /* Large line height to match the "notebook lines" background */
            line-height: 1.2em; 
            padding-top: 0.2em;
        }

        /* Microphone Button Animations */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .recording {
            animation: pulse 1.5s infinite;
            background-color: #ef4444 !important; /* Red when recording */
            color: white !important;
        }

        /* Sparkle animation for successful recognition */
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .sparkle-icon {
            position: absolute;
            color: #facc15;
            animation: sparkle 1s ease-in-out forwards;
            pointer-events: none;
        }
        
        /* Message Box Styling */
        .message-box {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .message-box.hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-8">

    <header class="w-full max-w-4xl flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-yellow-300 rounded-full flex items-center justify-center text-2xl shadow-md">
                🌟
            </div>
            <h1 class="text-3xl sm:text-5xl font-bold text-green-800" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">
                말하는 대로 쓱쓱!
            </h1>
        </div>
        
        <!-- Controls for Text Size -->
        <div class="hidden sm:flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border-2 border-green-200">
            <span class="text-gray-600 text-lg mr-2">글자 크기:</span>
            <button id="btnDecreaseText" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-xl text-gray-700 transition-colors border border-gray-300">
                가-
            </button>
            <button id="btnIncreaseText" class="w-10 h-10 rounded-full bg-green-100 hover:bg-green-200 flex items-center justify-center text-xl text-green-800 transition-colors border border-green-300">
                가+
            </button>
        </div>
    </header>

    <main class="w-full max-w-4xl flex-grow flex flex-col gap-6 relative">
        
        <!-- Display Board (Looks like a notebook page) -->
        <div class="paper-bg w-full flex-grow relative overflow-hidden border-4 border-green-300 flex flex-col p-6 pl-24 min-h-[40vh] sm:min-h-[50vh]">
            
            <!-- Sparkles Container -->
            <div id="sparkleContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            
            <!-- Default Placeholder Text -->
            <div id="placeholderText" class="absolute inset-0 flex items-center justify-center text-3xl sm:text-4xl text-gray-400 opacity-60 text-center p-8 pointer-events-none transition-opacity duration-300 pl-24">
                마이크를 누르고<br>말해볼까요? 🎤
            </div>
            
            <!-- Text Display Container -->
            <div id="textDisplay" class="text-display-area w-full h-full text-5xl sm:text-7xl md:text-8xl text-gray-800 font-bold break-words whitespace-pre-wrap outline-none z-10 transition-all duration-300" contenteditable="true" spellcheck="false"></div>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-6 mt-4 z-20">
            
            <!-- Clear Button -->
            <button id="btnClear" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white text-gray-500 hover:bg-gray-100 shadow-lg border-2 border-gray-200 flex flex-col items-center justify-center transition-transform hover:scale-105">
                <i class="fa-solid fa-eraser text-2xl sm:text-3xl mb-1"></i>
                <span class="text-sm font-bold">지우기</span>
            </button>

            <!-- Main Microphone Button -->
            <div class="relative group">
                <!-- Status Tooltip -->
                <div id="statusTooltip" class="absolute -top-16 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-lg px-4 py-2 rounded-2xl whitespace-nowrap opacity-0 transition-opacity duration-300 pointer-events-none shadow-lg">
                    누르고 말하세요!
                    <!-- Arrow down -->
                    <div class="absolute w-3 h-3 bg-gray-800 transform rotate-45 left-1/2 -bottom-1 -translate-x-1/2"></div>
                </div>

                <button id="btnMic" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-blue-500 text-white shadow-[0_8px_0_0_#2563eb] hover:shadow-[0_4px_0_0_#2563eb] hover:translate-y-1 active:shadow-none active:translate-y-2 transition-all duration-150 flex flex-col items-center justify-center border-4 border-white">
                    <i id="micIcon" class="fa-solid fa-microphone text-4xl sm:text-5xl mb-2"></i>
                    <span id="micText" class="text-xl sm:text-2xl font-bold tracking-wide">말하기</span>
                </button>
            </div>
            
            <!-- Copy Button -->
            <button id="btnCopy" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white text-green-600 hover:bg-green-50 shadow-lg border-2 border-green-200 flex flex-col items-center justify-center transition-transform hover:scale-105">
                <i class="fa-regular fa-copy text-2xl sm:text-3xl mb-1"></i>
                <span class="text-sm font-bold">복사</span>
            </button>
        </div>
        
        <!-- Mobile Text Size Controls (Visible only on small screens) -->
        <div class="flex sm:hidden items-center justify-center gap-4 mt-2 bg-white p-3 rounded-3xl shadow-sm border-2 border-green-200 mx-auto w-max">
            <span class="text-gray-600 text-lg">글씨 크기:</span>
            <button id="btnDecreaseTextMobile" class="w-12 h-12 rounded-full bg-gray-100 active:bg-gray-200 flex items-center justify-center text-2xl text-gray-700 border border-gray-300">
                -
            </button>
            <button id="btnIncreaseTextMobile" class="w-12 h-12 rounded-full bg-green-100 active:bg-green-200 flex items-center justify-center text-2xl text-green-800 border border-green-300">
                +
            </button>
        </div>

    </main>

    <div id="messageBox" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40 z-50 hidden backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl border-4 border-yellow-400 text-center transform scale-95 transition-transform duration-300 relative overflow-hidden" id="messageBoxContent">
            <!-- Decorative background -->
            <div class="absolute -top-10 -right-10 w-24 h-24 bg-yellow-100 rounded-full opacity-50"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-100 rounded-full opacity-50"></div>
            
            <div id="messageIcon" class="text-5xl mb-4 relative z-10">ℹ️</div>
            <h2 id="messageTitle" class="text-3xl font-bold text-gray-800 mb-2 relative z-10">알림</h2>
            <p id="messageText" class="text-xl text-gray-600 mb-6 relative z-10">메시지 내용</p>
            <button id="btnMessageClose" class="w-full bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xl font-bold py-3 px-6 rounded-2xl shadow-md transition-colors relative z-10">
                확인
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // UI Elements
            const textDisplay = document.getElementById('textDisplay');
            const placeholderText = document.getElementById('placeholderText');
            const btnMic = document.getElementById('btnMic');
            const micIcon = document.getElementById('micIcon');
            const micText = document.getElementById('micText');
            const btnClear = document.getElementById('btnClear');
            const btnCopy = document.getElementById('btnCopy');
            const statusTooltip = document.getElementById('statusTooltip');
            const sparkleContainer = document.getElementById('sparkleContainer');
            
            // Text Size Controls
            const btnIncreaseText = document.getElementById('btnIncreaseText');
            const btnDecreaseText = document.getElementById('btnDecreaseText');
            const btnIncreaseTextMobile = document.getElementById('btnIncreaseTextMobile');
            const btnDecreaseTextMobile = document.getElementById('btnDecreaseTextMobile');

            // Message Box Elements
            const messageBox = document.getElementById('messageBox');
            const messageBoxContent = document.getElementById('messageBoxContent');
            const messageTitle = document.getElementById('messageTitle');
            const messageText = document.getElementById('messageText');
            const messageIcon = document.getElementById('messageIcon');
            const btnMessageClose = document.getElementById('btnMessageClose');

            // State variables
            let isRecording = false;
            let recognition = null;
            let currentFontSize = 5; // Start with text-5xl equivalent (rem)
            const minFontSize = 3;
            const maxFontSize = 10;
            
            // Initial setup based on screen size
            if (window.innerWidth < 640) {
                 currentFontSize = 4; // Smaller start for mobile
            } else {
                 currentFontSize = 6; // Larger start for desktop
            }
            updateFontSize();

            function setupSpeechRecognition() {
                // Check if browser supports Speech Recognition
                window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (!window.SpeechRecognition) {
                    showMessage("앗, 죄송해요!", "이 브라우저에서는 말하기 기능을 사용할 수 없어요. 크롬(Chrome)이나 사파리(Safari) 브라우저를 사용해 주세요.", "😢");
                    btnMic.disabled = true;
                    btnMic.classList.add('opacity-50', 'cursor-not-allowed');
                    return false;
                }

                recognition = new SpeechRecognition();
                recognition.lang = 'ko-KR'; // Set language to Korean
                recognition.interimResults = true; // Show results while speaking
                recognition.continuous = true; // Keep listening until stopped

                recognition.onstart = () => {
                    isRecording = true;
                    updateMicUI();
                    showTooltip("듣고 있어요...", "bg-red-500");
                };

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    let interimTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript + ' ';
                            createSparkles(); // Add visual feedback for final word
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    // Append new final text or show interim text
                    if (finalTranscript !== '') {
                        // If display has content, append a space before new text
                        const currentText = textDisplay.innerText;
                        if (currentText.trim() !== '') {
                            textDisplay.innerText = currentText.trim() + ' ' + finalTranscript;
                        } else {
                            textDisplay.innerText = finalTranscript;
                        }
                    } else if (interimTranscript !== '') {
                        // We could show interim text here, but for kids, it might be confusing if it flickers.
                        // For a smoother experience, we'll only append final results, 
                        // but you could add a visual indicator that they are speaking.
                        showTooltip("말씀하시는 중...", "bg-green-500");
                    }
                    
                    updatePlaceholderVisibility();
                    
                    // Keep scroll at bottom
                    textDisplay.scrollTop = textDisplay.scrollHeight;
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error', event.error);
                    
                    if (event.error === 'not-allowed') {
                        showMessage("마이크 권한 필요", "마이크를 사용할 수 있도록 허용해 주세요!", "🎤");
                    } else if (event.error === 'no-speech') {
                         // Ignored, just no speech detected
                    } else if (event.error !== 'aborted') {
                        showMessage("오류 발생", "잘 못 알아들었어요. 다시 한 번 말해볼까요?", "🤔");
                    }
                    
                    // Reset state on any error
                    isRecording = false;
                    updateMicUI();
                };

                recognition.onend = () => {
                    // Ensure UI resets when recognition naturally stops or times out
                    isRecording = false;
                    updateMicUI();
                };

                return true;
            }

            function updateMicUI() {
                if (isRecording) {
                    btnMic.classList.add('recording', 'bg-red-500', 'shadow-[0_8px_0_0_#991b1b]', 'border-red-200');
                    btnMic.classList.remove('bg-blue-500', 'shadow-[0_8px_0_0_#2563eb]', 'border-white');
                    micIcon.classList.remove('fa-microphone');
                    micIcon.classList.add('fa-stop');
                    micText.innerText = '멈추기';
                } else {
                    btnMic.classList.remove('recording', 'bg-red-500', 'shadow-[0_8px_0_0_#991b1b]', 'border-red-200');
                    btnMic.classList.add('bg-blue-500', 'shadow-[0_8px_0_0_#2563eb]', 'border-white');
                    micIcon.classList.remove('fa-stop');
                    micIcon.classList.add('fa-microphone');
                    micText.innerText = '말하기';
                    showTooltip("누르고 말하세요!", "bg-gray-800");
                }
            }

            function updatePlaceholderVisibility() {
                if (textDisplay.innerText.trim() === '') {
                    placeholderText.style.opacity = '0.6';
                } else {
                    placeholderText.style.opacity = '0';
                }
            }

            // Text Size Management
            function updateFontSize() {
                textDisplay.style.fontSize = `${currentFontSize}rem`;
            }

            function increaseFontSize() {
                if (currentFontSize < maxFontSize) {
                    currentFontSize += 1;
                    updateFontSize();
                }
            }

            function decreaseFontSize() {
                if (currentFontSize > minFontSize) {
                    currentFontSize -= 1;
                    updateFontSize();
                }
            }

            function showTooltip(text, bgClass) {
                statusTooltip.innerText = text;
                statusTooltip.className = `absolute -top-16 left-1/2 transform -translate-x-1/2 text-white text-lg px-4 py-2 rounded-2xl whitespace-nowrap transition-opacity duration-300 pointer-events-none shadow-lg ${bgClass}`;
                
                // Add the arrow back
                const arrow = document.createElement('div');
                arrow.className = `absolute w-3 h-3 transform rotate-45 left-1/2 -bottom-1 -translate-x-1/2 ${bgClass}`;
                statusTooltip.appendChild(arrow);

                statusTooltip.style.opacity = '1';
                
                // Hide tooltip after a while if not recording
                if (!isRecording) {
                    setTimeout(() => {
                        if (!isRecording) statusTooltip.style.opacity = '0';
                    }, 3000);
                }
            }

            function createSparkles() {
                const colors = ['#facc15', '#34d399', '#60a5fa', '#f472b6'];
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const sparkle = document.createElement('i');
                        sparkle.className = 'fa-solid fa-star sparkle-icon';
                        
                        // Random position within the container
                        const x = Math.random() * 100;
                        const y = Math.random() * 100;
                        
                        // Random size and color
                        const size = 1 + Math.random() * 2;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        sparkle.style.left = `${x}%`;
                        sparkle.style.top = `${y}%`;
                        sparkle.style.fontSize = `${size}rem`;
                        sparkle.style.color = color;
                        
                        sparkleContainer.appendChild(sparkle);
                        
                        // Remove element after animation ends
                        setTimeout(() => {
                            sparkle.remove();
                        }, 1000);
                    }, i * 100); // Stagger the sparkles
                }
            }

            function showMessage(title, text, icon = 'ℹ️') {
                messageTitle.innerText = title;
                messageText.innerText = text;
                messageIcon.innerText = icon;
                
                messageBox.classList.remove('hidden');
                // Trigger reflow for animation
                void messageBox.offsetWidth; 
                messageBoxContent.classList.remove('scale-95');
                messageBoxContent.classList.add('scale-100');
            }

            function hideMessage() {
                messageBoxContent.classList.remove('scale-100');
                messageBoxContent.classList.add('scale-95');
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 300);
            }

            btnMic.addEventListener('click', () => {
                if (!recognition && !setupSpeechRecognition()) {
                    return; // Setup failed (not supported)
                }

                if (isRecording) {
                    // Stop recording
                    try {
                        recognition.stop();
                    } catch (e) {
                        console.error("Error stopping recognition:", e);
                    }
                    isRecording = false;
                    updateMicUI();
                } else {
                    // Start recording
                    try {
                        // Optimistically set to true to prevent double clicks throwing InvalidStateError
                        isRecording = true; 
                        updateMicUI();
                        recognition.start();
                    } catch (e) {
                        console.error("Could not start recognition:", e);
                        if (e.name === 'InvalidStateError') {
                            console.warn("Recognition is already running.");
                        } else {
                            isRecording = false;
                            updateMicUI();
                            // Try to stop just in case it's in a weird state
                            try { recognition.stop(); } catch(err) {}
                        }
                    }
                }
            });

            btnClear.addEventListener('click', () => {
                if (textDisplay.innerText.trim() !== '') {
                    textDisplay.innerText = '';
                    updatePlaceholderVisibility();
                    createSparkles(); // Little reward for clearing
                }
            });

            btnCopy.addEventListener('click', () => {
                const textToCopy = textDisplay.innerText;
                if (textToCopy.trim() === '') {
                    showMessage("알림", "아직 쓰여진 글씨가 없어요!", "📝");
                    return;
                }

                // Try modern Clipboard API first, fallback to execCommand
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showMessage("성공!", "글씨를 복사했어요!\n원하는 곳에 붙여넣기 해보세요.", "✨");
                    }).catch(err => {
                        console.error('Failed to copy: ', err);
                        fallbackCopyTextToClipboard(textToCopy);
                    });
                } else {
                    fallbackCopyTextToClipboard(textToCopy);
                }
            });

            function fallbackCopyTextToClipboard(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                
                // Avoid scrolling to bottom
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showMessage("성공!", "글씨를 복사했어요!", "✨");
                    } else {
                        showMessage("오류", "복사하지 못했어요.", "😥");
                    }
                } catch (err) {
                    showMessage("오류", "이 브라우저에서는 복사할 수 없어요.", "😥");
                }
                
                document.body.removeChild(textArea);
            }

            // Text Size Listeners
            btnIncreaseText.addEventListener('click', increaseFontSize);
            btnDecreaseText.addEventListener('click', decreaseFontSize);
            btnIncreaseTextMobile.addEventListener('click', increaseFontSize);
            btnDecreaseTextMobile.addEventListener('click', decreaseFontSize);

            // Hide placeholder when typing manually
            textDisplay.addEventListener('input', updatePlaceholderVisibility);

            // Message Box Close Listener
            btnMessageClose.addEventListener('click', hideMessage);

            // Show initial tooltip for instructions
            setTimeout(() => {
                if (!isRecording) {
                    showTooltip("마이크를 누르고 말해봐요!", "bg-blue-600");
                }
            }, 1000);
            
            // Initialize setup in case user clicks before first interaction
            setupSpeechRecognition();
        });
    </script>
</body>
</html>
